<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mut:#5b667a;--bd:#d5dbe6;--ac:#1f3fbf;--acx:#fff;--ok:#157347;--no:#b3261e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mut:#9aa6bd;--bd:#2d3650;--ac:#6f8cff;--acx:#0b1020;--ok:#4cc38a;--no:#ff7b72}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mut:#9aa6bd;--bd:#2d3650;--ac:#6f8cff;--acx:#0b1020;--ok:#4cc38a;--no:#ff7b72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}
.f{margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg)}
.mem .f{margin-bottom:6px}.mem input{background:var(--card)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.cnt div{display:flex;align-items:center;gap:6px;justify-content:space-between;border:1px solid var(--bd);border-radius:8px;padding:4px 4px 4px 8px;background:var(--bg)}
.cnt span{font-size:13px;flex:1;min-width:0}
.cnt input{width:56px;text-align:center;padding:6px 2px;border-radius:6px}
.q{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.q:last-child{border:0}
.tg{display:flex;gap:6px;flex:none}
.tg button{min-width:54px;padding:8px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:600 13px inherit}
.tg button.s.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.tg button.n.on{background:var(--no);color:#fff;border-color:var(--no)}
.r{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
.r input{width:22px;height:22px}
.sig{border:1px dashed var(--mut);border-radius:10px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sh label{margin:0}
.lnk{background:none;border:0;color:var(--ac);font:600 13px inherit;padding:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:300px;padding:13px;border-radius:10px;border:1px solid var(--bd);font:700 15px inherit;background:var(--bg);color:var(--tx)}
.bar .p{background:var(--ac);color:var(--acx);border-color:var(--ac);flex:2}
#msg{text-align:center;font-size:13px;color:var(--mut);min-height:18px;margin:0 0 8px}
</style>
</head>

<section><h2>Assinaturas</h2>
<div class="f"><div class="sh"><label>Responsável técnico</label><button class="lnk" data-c="0">Limpar</button></div><canvas class="sig" id="s0"></canvas></div>
<div class="f"><div class="sh"><label>Cliente</label><button class="lnk" data-c="1">Limpar</button></div><canvas class="sig" id="s1"></canvas></div>
</section>
<p id="msg"></p>
</main>
<div class="bar"><button id="novo">Novo</button><button class="p" id="gerar">Gerar PDF</button></div>

<script>
var MAQ=["Condensadoras + Evaporadoras (Splits)","Fancoils","Fancoletes","Chiller RM","Chiller Conforto","Centrais/Packages","VRFs","Selfs"];
var DL=["DME","Greenant","DRI/DCG","DMT","DVI","DAF","DAV","Modems","APs Internos","APs Externos","DAT_Interno","DAT_Externo","SantaBOX","VivoBOX"];
var DR=["DAC_Sem Pressão","DAC_Com Pressão","Engate de 1/2\"","Engate de 7/16\"","DUT_Monitoramento","DUT_Automação","DUT_DUO","DUT_Externo","DUT_QA","DUT_Cortina de AR","DUT_CO2","DUT_Umidade","DAM","DAM Iluminação/DAL"];
var CK=["Os ambientes estão sendo entregues limpos.","Os forros e paredes que sofreram intervenção da DIEL estão limpos.","Os forros e paredes que sofreram intervenção da DIEL estão íntegros.","Os DUTs estão embutidos e seus sensores instalados de maneira adequada.","O rack está instalado em local aprovado pelo líder da unidade.","A instalação não possui fios aparentes em locais internos.","A infraestrutura de rede foi instalada com bom acabamento.","As máquinas que sofreram intervenção da DIEL estão íntegras.","As máquinas que sofreram intervenção da DIEL estão com as mesmas características de operação pré-instalação."];
var DV=DL.concat(DR);
var $=function(i){return document.getElementById(i)};
var ans=CK.map(function(){return null});

function cnt(box,arr,pre){arr.forEach(function(n,i){var d=document.createElement("div");d.innerHTML="<span></span><input type='number' inputmode='numeric' min='0' id='"+pre+i+"'>";d.firstChild.textContent=n;box.appendChild(d)})}
cnt($("maq"),MAQ,"m");cnt($("dev"),DV,"d");
for(var i=0;i<3;i++){var t=document.createElement("div");t.className="mem";t.innerHTML="<div class='f'><label>Nome completo "+(i+1)+"</label><input type='text' id='tn"+i+"'></div><div class='g2'><div class='f'><label>Função</label><input type='text' id='tf"+i+"'></div><div class='f'><label>Empresa</label><input type='text' id='te"+i+"'></div></div>";$("team").appendChild(t)}
$("tf0").value="Técnico";$("te0").value="Almeida Elétrica";$("tn0").value="Nathan Silva Santos de Almeida";
CK.forEach(function(q,i){var d=document.createElement("div");d.className="q";d.innerHTML="<span></span><div class='tg'><button class='s' data-i='"+i+"' data-v='1'>SIM</button><button class='n' data-i='"+i+"' data-v='0'>NÃO</button></div>";d.firstChild.textContent=q;$("chk").appendChild(d)});
$("chk").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i,v=+b.dataset.v;ans[i]=ans[i]===v?null:v;paint()});
function paint(){document.querySelectorAll("#chk button").forEach(function(b){b.classList.toggle("on",ans[+b.dataset.i]===+b.dataset.v)})}
var today=new Date().toISOString().slice(0,10);$("data").value=today;$("dsig").value=today;

/* assinaturas */
var pads=[0,1].map(function(k){
  var c=$("s"+k),x=c.getContext("2d"),drawing=false,has=false;
  function size(){var r=c.getBoundingClientRect(),dp=window.devicePixelRatio||1;c.width=r.width*dp;c.height=r.height*dp;x.setTransform(dp,0,0,dp,0,0);x.fillStyle="#fff";x.fillRect(0,0,r.width,r.height);x.lineWidth=2.2;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0a1a5c";has=false}
  function pt(e){var r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
  c.addEventListener("pointerdown",function(e){drawing=true;has=true;c.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();e.preventDefault()});
  c.addEventListener("pointermove",function(e){if(!drawing)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke();e.preventDefault()});
  ["pointerup","pointercancel"].forEach(function(n){c.addEventListener(n,function(){drawing=false})});
  window.addEventListener("load",size);
  return{clear:size,has:function(){return has},img:function(){return{u:c.toDataURL("image/jpeg",.92),w:c.width,h:c.height}}};
});
document.querySelectorAll("[data-c]").forEach(function(b){b.addEventListener("click",function(){pads[+b.dataset.c].clear()})});

function msg(t){$("msg").textContent=t}
$("novo").addEventListener("click",function(){
  if(!confirm("Limpar tudo e começar um novo termo?"))return;
  document.querySelectorAll("input[type=text],input[type=number],textarea").forEach(function(e){e.value=""});
  document.querySelectorAll("input[name=apr]").forEach(function(e){e.checked=false});
  ans=ans.map(function(){return null});paint();pads.forEach(function(p){p.clear()});
  $("data").value=today;$("dsig").value=today;$("tecnico").value="Nathan Silva Santos de Almeida";
  $("tn0").value="Nathan Silva Santos de Almeida";$("tf0").value="Técnico";$("te0").value="Almeida Elétrica";
  window.scrollTo(0,0);msg("");
});

function fdate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];


function Pdf(){
var P=[[]],I=[],K=72/25.4,S={fs:10,b:0,dc:"0 0 0",tc:"0 0 0",lw:.25},cx=document.createElement("canvas").getContext("2d"),T=this;
function W(s){cx.font=(S.b?"bold ":"")+S.fs+"px Helvetica,Arial,sans-serif";return cx.measureText(s).width/K}
function E(s){var o="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c==8211)c=150;if(c>255)c=63;var h=String.fromCharCode(c);o+=(h=="("||h==")"||h=="\\")?"\\"+h:h}return o}
function Y(y){return((297-y)*K).toFixed(2)}
function F(x){return(x*K).toFixed(2)}
function C(r,g,b){return[r,g,b].map(function(v){return(v/255).toFixed(3)}).join(" ")}
function put(s){P[P.length-1].push(s)}
T.setLineWidth=function(w){S.lw=w};
T.setDrawColor=function(r,g,b){S.dc=C(r,g,b)};
T.setTextColor=function(r,g,b){S.tc=C(r,g,b)};
T.setFont=function(n,s){S.b=s==="bold"};
T.setFontSize=function(n){S.fs=n};
T.rect=function(x,y,w,h){put(S.dc+" RG "+F(S.lw)+" w "+F(x)+" "+Y(y+h)+" "+F(w)+" "+F(h)+" re S")};
T.line=function(a,b,c,e){put(S.dc+" RG "+F(S.lw)+" w "+F(a)+" "+Y(b)+" m "+F(c)+" "+Y(e)+" l S")};
T.splitTextToSize=function(t,mw){var out=[];String(t).split("\n").forEach(function(p){var line="";p.split(" ").forEach(function(w){var n=line?line+" "+w:w;if(line&&W(n)>mw){out.push(line);line=w}else line=n});out.push(line)});return out};
T.text=function(t,x,y,o){o=o||{};var A=Array.isArray(t)?t:[String(t)];A.forEach(function(s,i){var fs=S.fs,w=W(s);if(o.maxWidth&&w>o.maxWidth){fs=fs*o.maxWidth/w;w=o.maxWidth}var xx=o.align==="center"?x-w/2:x;put("BT /F"+(S.b?2:1)+" "+fs.toFixed(2)+" Tf "+S.tc+" rg "+F(xx)+" "+Y(y+i*S.fs/K*1.2)+" Td ("+E(s)+") Tj ET")})};
T.addPage=function(){P.push([])};
T.addImage=function(im,x,y,w,h){I.push(im);put("q "+F(w)+" 0 0 "+F(h)+" "+F(x)+" "+Y(y+h)+" cm /Im"+(I.length-1)+" Do Q")};
T.output=function(){
var ch=[],pos=0,off=[],n=I.length,pg=[];
function b(s){var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u}
function add(x){ch.push(x);pos+=x.length}
function obj(k,parts){off[k]=pos;add(b(k+" 0 obj\n"));parts.forEach(function(p){add(typeof p==="string"?b(p):p)});add(b("\nendobj\n"))}
add(b("%PDF-1.4\n"));
P.forEach(function(_,i){pg.push((5+n+2*i+1)+" 0 R")});
obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
obj(2,["<< /Type /Pages /Kids ["+pg.join(" ")+"] /Count "+P.length+" >>"]);
obj(3,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"]);
obj(4,["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"]);
I.forEach(function(im,i){var bin=atob(im.u.split(",")[1]),u=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);obj(5+i,["<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+u.length+" >>\nstream\n",u,"\nendstream"])});
var xo=I.map(function(_,i){return"/Im"+i+" "+(5+i)+" 0 R"}).join(" ");
P.forEach(function(c,i){var s=c.join("\n"),cn=5+n+2*i;obj(cn,["<< /Length "+s.length+" >>\nstream\n",b(s),"\nendstream"]);obj(cn+1,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << "+xo+" >> >> /Contents "+cn+" 0 R >>"])});
var tot=5+n+2*P.length,xr=pos,x="xref\n0 "+tot+"\n0000000000 65535 f \n";
for(var k=1;k<tot;k++)x+=("0000000000"+off[k]).slice(-10)+" 00000 n \n";
x+="trailer\n<< /Size "+tot+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";add(b(x));
return new Blob(ch,{type:"application/pdf"})};
}

function build(){
  var d=new Pdf(),L=15,W=180;
  d.setLineWidth(.25);d.setDrawColor(30,40,100);
  function cell(x,y,w,h,txt,bold,size){d.rect(x,y,w,h);d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(size||8.5);d.text(String(txt||""),x+1.5,y+h/2+1.2,{maxWidth:w-3})}
  function lv(x,y,w,h,lab,val,lw){cell(x,y,lw,h,lab);cell(x+lw,y,w-lw,h,val)}
  function head(t,y){d.setFont("helvetica","bold");d.setFontSize(10);d.text(t,L,y)}
  function logo(){var cx=90,cy=11,r=4.6,cl=[[0,190,140],[20,150,190],[40,70,200]];d.setLineWidth(1.3);[0,60,120].forEach(function(a,i){var t=a*Math.PI/180,dx=r*Math.cos(t),dy=r*Math.sin(t);d.setDrawColor(cl[i][0],cl[i][1],cl[i][2]);d.line(cx-dx,cy-dy,cx+dx,cy+dy)});d.setDrawColor(30,40,100);d.setLineWidth(.25);d.setFont("helvetica","bold");d.setFontSize(26);d.setTextColor(10,10,10);d.text("diel",97,15.5);d.setTextColor(0,0,0)}
  logo();
  d.setFont("helvetica","bold");d.setFontSize(11);d.text("RELATÓRIO DE INSTALAÇÃO – TERMO DE ACEITE",105,24,{align:"center"});
  var y=31;head("1.1 DADOS DA UNIDADE",y);y+=3;
  lv(L,y,120,6,"CLIENTE:",$("cliente").value,20);lv(L+120,y,60,6,"UNIDADE:",$("unidade").value,20);y+=6;
  lv(L,y,120,6,"ENDEREÇO:",$("endereco").value,20);lv(L+120,y,60,6,"N°:",$("numero").value,20);y+=6;
  lv(L,y,120,6,"CIDADE/UF:",$("cidade").value,20);lv(L+120,y,60,6,"BAIRRO:",$("bairro").value,20);y+=10;
  head("1.2 EQUIPE DE INSTALAÇÃO",y);y+=3;
  var cw=[75,55,50],hd=["NOME COMPLETO","FUNÇÃO","EMPRESA"],xx=L;
  hd.forEach(function(h,i){cell(xx,y,cw[i],6,h,true);xx+=cw[i]});y+=6;
  for(var r=0;r<3;r++){xx=L;["tn","tf","te"].forEach(function(p,i){cell(xx,y,cw[i],6,$(p+r).value);xx+=cw[i]});y+=6}
  y+=4;head("2. RELATÓRIO DE INSTALAÇÃO",y);y+=3;
  lv(L,y,W,6,"DATA:",fdate($("data").value),20);y+=6;
  lv(L,y,W,6,"Técnico:",$("tecnico").value,20);y+=6;
  var y0=y;
  MAQ.forEach(function(n,i){lv(L+90,y,90,5.6,n,$("m"+i).value,72);y+=5.6});
  d.rect(L,y0,90,y-y0);d.setFont("helvetica","normal");d.setFontSize(8.5);d.text("Número de máquinas com dispositivo instalado",L+45,(y0+y)/2,{align:"center",maxWidth:80});
  y0=y;
  for(var i=0;i<14;i++){
    lv(L+25,y,77,5.6,DL[i],$("d"+i).value,62);
    lv(L+102,y,78,5.6,DR[i],$("d"+(14+i)).value,63);
    y+=5.6;
  }
  d.rect(L,y0,25,y-y0);d.text("Número de",L+12.5,(y0+y)/2-1,{align:"center"});d.text("dispositivos",L+12.5,(y0+y)/2+3,{align:"center"});
  lv(L,y,W,6,"Total de dispositivos em ambientes internos",$("tint").value,150);y+=6;
  lv(L,y,W,6,"Total de dispositivos em ambientes externos",$("text").value,150);

  d.addPage();logo();
  y=26;d.setFont("helvetica","normal");d.setFontSize(9.5);
  d.text(d.splitTextToSize("Na qualidade de responsável técnico pela unidade supracitada, recebi da DIEL Energia o relatório de Instalação, analisei o documento e declaro que:",W),L,y);y+=11;
  cell(L,y,150,6,"RESPONDA AS AFIRMAÇÕES ABAIXO:",true);cell(L+150,y,15,6,"SIM",true);cell(L+165,y,15,6,"NÃO",true);y+=6;
  CK.forEach(function(q,i){
    var ln=d.splitTextToSize(q,146),h=ln.length>1?9:6;
    d.rect(L,y,150,h);d.rect(L+150,y,15,h);d.rect(L+165,y,15,h);
    d.setFont("helvetica","normal");d.setFontSize(8.5);d.text(ln,L+1.5,y+(h>6?3.6:4),{});
    d.setFont("helvetica","bold");d.setFontSize(10);
    if(ans[i]===1)d.text("X",L+157.5,y+h/2+1.5,{align:"center"});
    if(ans[i]===0)d.text("X",L+172.5,y+h/2+1.5,{align:"center"});
    y+=h;
  });
  y+=6;var a=document.querySelector("input[name=apr]:checked");a=a?+a.value:-1;
  ["Aprovo a instalação sem ressalvas;","Aprovo a instalação com as seguintes ressalvas;","Não aprovo a instalação."].forEach(function(t,i){
    d.setFont("helvetica","normal");d.setFontSize(9.5);d.text("("+(a===i?"X":" ")+") "+t,L,y);y+=6});
  y+=2;d.rect(L,y,W,45);d.setFont("helvetica","bold");d.setFontSize(9);d.text("Obs:",L+2,y+5);
  d.setFont("helvetica","normal");d.text(d.splitTextToSize($("obs").value,W-6).slice(0,9),L+2,y+10);
  y+=55;
  var ds=$("dsig").value,dt="";
  if(ds){var p=ds.split("-");dt=($("local").value||"")+", "+(+p[2])+" de "+MES[+p[1]-1]+" de "+p[0]}else dt=$("local").value;
  d.setFont("helvetica","normal");d.setFontSize(10);d.text(dt,105,y,{align:"center"});
  y+=28;
  [0,1].forEach(function(k){
    var x=k?112:20;
    if(pads[k].has())d.addImage(pads[k].img(),x,y-24,70,24);
    d.line(x,y,x+78,y);d.setFont("helvetica","bold");d.setFontSize(9.5);
    d.text(k?"Assinatura do cliente":"Assinatura do Responsável Técnico",x+39,y+5,{align:"center"});
  });
  d.setFont("helvetica","normal");d.setFontSize(8);
  d.text(["DIEL Energia LTDA.","Avenida Cardoso de Melo, 1608 (11º A)","Site: www.dielenergia.com","E-mail: diel@dielenergia.com"],105,268,{align:"center"});
  return d;
}

$("gerar").addEventListener("click",async function(){
  try{
    if(!pads[0].has()||!pads[1].has()){if(!confirm("Falta alguma assinatura. Gerar mesmo assim?"))return}
    var d=build(),nome="TCO_"+($("cliente").value||"cliente").replace(/[^\w\-]+/g,"_")+"_"+$("data").value+".pdf";
    var blob=d.output(),dl=null;
    try{if(typeof claude!=="undefined")dl=await claude.use("downloads")}catch(e){}
    if(dl)await dl.save({filename:nome,data:blob});
    else{var f=new File([blob],nome,{type:"application/pdf"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nome})}catch(e){if(e.name==="AbortError"){msg("Cancelado.");return}throw e}}
      else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove()}}
    msg("PDF gerado ✔");
  }catch(e){msg(e&&e.code==="declined"?"Download cancelado.":"Não foi possível gerar o PDF.")}
});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
